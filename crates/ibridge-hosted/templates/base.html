<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{% endblock %}</title>
<style>
:root { color-scheme: light dark; --bg: #f6f6f4; --card: #ffffff; --ink: #1c1c1e; --muted: #5c5c63; --line: #c9c9cf; --accent: #0a5fd6; --accent-ink: #ffffff; --danger: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #111114; --card: #1c1c20; --ink: #f2f2f5; --muted: #a4a4ad; --line: #3a3a42; --accent: #6aa7ff; --accent-ink: #0b1a33; --danger: #ff8a80; } }
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 28rem; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
h1 { font-size: 1.35rem; line-height: 1.25; margin: 0 0 12px; }
p { margin: 0 0 12px; }
label { display: block; margin: 16px 0 4px; font-weight: 600; }
input[type=email], input[type=password] { width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin-top: 16px; }
.check input { margin-top: 5px; }
.hint { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }
.error { color: var(--danger); font-weight: 600; }
a { color: var(--accent); }
button { margin-top: 20px; width: 100%; padding: 12px; font: inherit; font-weight: 600; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
