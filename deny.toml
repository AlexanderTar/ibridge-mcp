# Only these licences may be linked. GPL and LGPL are not allowed.
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

# Drop RUSTSEC-2026-0459 when a published sqlx release allows
# libsqlite3-sys >= 0.39. sqlx 0.9.0 (latest on crates.io) requires
# >= 0.30.1, < 0.38.0, so `cargo update -p libsqlite3-sys` cannot
# select the SQLite 3.54 fix (libsqlite3-sys 0.39 / 0.40).
# CVE-2026-119375: bundled SQLite before 3.54.0 can return
# uninitialized page-cache memory when a database is opened together
# with a sibling -wal whose page size differs. Tracked in
# https://github.com/transact-rs/sqlx/issues/4516
[advisories]
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "sqlx 0.9.0 cannot select libsqlite3-sys >= 0.39; remove when sqlx publishes that bound" },
]
