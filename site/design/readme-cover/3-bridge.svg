      <text x="1144" y="308" text-anchor="middle">Your assistant</text>
    </g>
    <!-- Mail, Calendar, Contacts crossing the deck -->
    
      <rect x="762" y="196" width="58" height="58" rx="14" fill="#12303A" stroke="#24445E" stroke-width="1.5"/>
