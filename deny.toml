# Advisories with no upgrade yet. Each entry says when to drop it.
#
# RUSTSEC-2026-0440: `testcontainers` 0.28 pulls `astral-tokio-tar`, which
# RustSec marks unmaintained and says has no safe upgrade. It is a test-only
# dependency used to copy files into containers.
#
# RUSTSEC-2026-0459 (CVE-2026-119375): bundled SQLite before 3.54.0 can return
# uninitialized page-cache memory when a database is opened together with a
# sibling -wal whose page size differs. sqlx 0.9.0 (latest on crates.io)
# requires libsqlite3-sys >= 0.30.1, < 0.38.0, so `cargo update -p
# libsqlite3-sys` cannot select the fix (0.39 / 0.40). Drop it when a sqlx
# release allows libsqlite3-sys >= 0.39. Tracked in
# https://github.com/transact-rs/sqlx/issues/4516
#
# RUSTSEC-2026-0441: pin-utils 0.1.1 is archived and comes in through
# async-imap 0.12. Drop it when async-imap stops depending on pin-utils.
#
# RUSTSEC-2026-0543, RUSTSEC-2026-0555: chrono and chrono-tz are unmaintained
# (not vulnerabilities) and RustSec says no safe upgrade exists. It comes in through async-imap 0.12, calcard 0.3,
# chrono-tz and imap-codec, so it cannot go without replacing those crates. Drop
# it when they move to jiff or time.
#
# RUSTSEC-2026-0370, RUSTSEC-2026-0371, RUSTSEC-2026-0372: zvariant,
# zbus_names and zvariant_derive 5.x were merged into zbus 6 and are flagged
# unmaintained. They come in through zbus 5 and secret-service 5, which
# zbus-secret-service-keyring-store 1.0.1 (the Linux keychain) depends on. No
# release of that store uses zbus 6. Drop them when it does.
[advisories]
ignore = [
    { id = "RUSTSEC-2026-0440", reason = "test-only testcontainers dependency with no safe upgrade" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5.x is unmaintained (merged into zbus 6); comes in through the Linux keychain store, which has no zbus 6 release" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.x is unmaintained (merged into zbus 6); comes in through the Linux keychain store, which has no zbus 6 release" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.x is unmaintained (merged into zbus 6); comes in through the Linux keychain store, which has no zbus 6 release" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils 0.1.1 is archived and comes in through async-imap 0.12; no patched release" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no safe upgrade; comes in through async-imap 0.12, calcard 0.3, chrono-tz and imap-codec; drop when they move to jiff or time" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained with no safe upgrade; comes in through calcard 0.3 and ibridge-calendar; drop when they move to jiff or time" },
    { id = "RUSTSEC-2026-0459", reason = "sqlx 0.9.0 cannot select libsqlite3-sys >= 0.39; remove when sqlx publishes that bound" },
]

