# Advisories with no upgrade yet. Each entry says when to drop it.
#
# RUSTSEC-2026-0440: `testcontainers` 0.28 pulls `astral-tokio-tar`, which
# RustSec marks unmaintained and says has no safe upgrade. It is a test-only
# dependency used to copy files into containers.
#
# RUSTSEC-2026-0459 (CVE-2026-119375): bundled SQLite before 3.54.0 can return
# uninitialized page-cache memory when a database is opened together with a
# sibling -wal whose page size differs. sqlx 0.9.0 (latest on crates.io)
# requires libsqlite3-sys >= 0.30.1, < 0.38.0, so `cargo update -p
# libsqlite3-sys` cannot select the fix (0.39 / 0.40). Drop it when a sqlx
# release allows libsqlite3-sys >= 0.39. Tracked in
# https://github.com/transact-rs/sqlx/issues/4516
[advisories]
ignore = [
    { id = "RUSTSEC-2026-0440", reason = "test-only testcontainers dependency with no safe upgrade" },
    { id = "RUSTSEC-2026-0459", reason = "sqlx 0.9.0 cannot select libsqlite3-sys >= 0.39; remove when sqlx publishes that bound" },
]

