[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/AlexanderTar/icloud-mcp"

# Dependencies arrive with the crates that use them. Versions live here so
# every crate resolves the same one.
[workspace.dependencies]
aes-gcm = "0.11"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
bytes = "1"
futures = "0.3"
getrandom = "0.4"
hkdf = "0.13"
http = "1"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "http2",
    "native-tokio",
    "ring",
    "tls12",
] }
hyper-util = { version = "0.1", features = [
    "client",
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
ibridge-auth = { path = "crates/ibridge-auth" }
ibridge-core = { path = "crates/ibridge-core" }
ibridge-testkit = { path = "crates/ibridge-testkit" }
imap-codec = "1.0.0"
insta = { version = "1", features = ["json"] }
keyring-core = "1"
lettre = { version = "0.11.23", default-features = false, features = [
    "ring",
    "rustls-native-certs",
    "smtp-transport",
    "tokio1-rustls",
] }
libdav = "0.11.2"
mail-builder = { version = "2.0.1", default-features = false }
mail-parser = "1.0"
proptest = "1"
rmcp = { version = "3.10", default-features = false }
roxmltree = "0.21"
schemars = "1"
secrecy = "0.10"
serde = "1"
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
temp-env = "0.3"
testcontainers = "0.28"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
trait-variant = "0.1"
trybuild = "1"
zeroize = "1"

# Lints pasted from BeautifulRust lints/lints.toml at
# b9718436d77ee7bcf17cdcb6aa27628feb95d97a, plus unsafe_code = "forbid"
# from the workspace rules. CI turns warnings into errors.

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
exhaustive_enums = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
