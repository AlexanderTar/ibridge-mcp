[workspace]
members = ["cargo:."]

# Config for 'dist'. Nothing is published until the user pushes a v* tag.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Homebrew formula goes to this tap. Publishing needs the HOMEBREW_TAP_TOKEN secret.
tap = "AlexanderTar/homebrew-tap"
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Sign macOS binaries with Developer ID. Reads CODESIGN_IDENTITY,
# CODESIGN_CERTIFICATE and CODESIGN_CERTIFICATE_PASSWORD from CI secrets.
macos-sign = true
# Pull requests never build release artefacts: the workflow runs on v* tags only.
pr-run-mode = "skip"
github-build-setup = "../build-setup.yml"
# release.yml is generated by dist and then edited by hand: the trigger is narrowed
# to v* tags, and notarize-macos and build-mcpb are added. allow-dirty stops
# dist from rejecting those edits. See docs/release.md before running dist generate.
allow-dirty = ["ci"]
