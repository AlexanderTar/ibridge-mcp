# release.yml is generated by dist. Its shell snippets draw shellcheck style
# and info notes that we don't edit by hand, so only that file skips them.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:.*'
      - 'shellcheck reported issue in this script: SC2129:.*'
      - 'shellcheck reported issue in this script: SC2001:.*'
