# One weekly pull request that updates every dependency: Rust crates,
# GitHub Actions, the site's npm packages and the Docker base images.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      # Its ref is the Rust version (pinned to match rust-toolchain.toml), not
      # an action release, so Dependabot's "newer" tags are toolchains that
      # don't exist yet.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: npm
    directory: /site
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
